[project]
name = "tradr"
version = "0.1.0"
description = "Advisory-only, confirm-each, rules-based investing engine (self-hosted, open-source)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradr"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI's `Depends(...)` in a default arg is the idiomatic pattern, not a bug
    "BLE001",  # broad `except Exception` is intentional in a few fail-safe spots (adapter,
               # bot handlers, notification path) so one bad ticker/message never crashes a run
    "DTZ005",  # naive `datetime.now()` is fine here — used only for local audit timestamps
    "DTZ011",  # naive `date.today()` is fine — "trade date" is a calendar date, not an instant
]

[tool.mypy]
python_version = "3.11"
strict = true
