<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- candlesticks: dip, dip, recovery -->
  <rect x="6" y="14" width="4" height="9" rx="1" fill="#f85149"/>
  <line x1="8" y1="11" x2="8" y2="26" stroke="#f85149" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="14" y="17" width="4" height="7" rx="1" fill="#f85149"/>
  <line x1="16" y1="15" x2="16" y2="26" stroke="#f85149" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="22" y="6" width="4" height="12" rx="1" fill="#3fb950"/>
  <line x1="24" y1="4" x2="24" y2="20" stroke="#3fb950" stroke-width="1.4" stroke-linecap="round"/>
  <!-- little spark celebrating the breakout -->
  <circle cx="24" cy="4" r="1.6" fill="#7ee787"/>
</svg>
